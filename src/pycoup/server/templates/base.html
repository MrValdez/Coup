<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.6/dist/htmx.min.js"
                integrity="sha384-Akqfrbj/HpNVo8k11SXBb6TlBWmXXlYQrCSqEWmyKJe+hDm3Z/B2WVG4smwBkRVm"
                crossorigin="anonymous"></script>
        <title>pyCoup</title>
        <style>
            th {
                text-align: center;
                --pico-font-weight: bold;
                --pico-font-size: 120%;
                --pico-font-family: Roboto;
            }
            div.player_name {
                border: 1px solid;
                width: 80%;
            }
        </style>
    </head>
    <body>
        <header class="container">
            <h1>{{title}}</h1>
            <em>Alpha version. Expect bugs</em>
        </header>

        <div class="container">
            {{ display_name_html|safe }}
            {% if error %}
                {{ error }}
            {% endif %}
        </dimv>

        <main class="container">
            {% block content %}
                {{ content|safe }}
            {% endblock %}
        </main>
    </body>
</html>
